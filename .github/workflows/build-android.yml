name: Build Android

# Every push to main is checked, tested and built in the cloud.
# The finished app is published as the "latest" release, so it can be
# installed on a phone from one fixed link. Nobody has to build by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release

      - name: Publish the latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk maktoob.apk
          ls -la maktoob.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest maktoob.apk \
            --target "$GITHUB_SHA" \
            --title "Latest test build" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Test build, not a store release." \
            --prerelease
