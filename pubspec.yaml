name: maktoob
description: "A premium personal audiobook and e-reading application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  epubx: ^4.0.0
  file_picker: ^13.4.0
  flutter_tts: ^4.1.1
  google_mlkit_translation: ^1.0.3
  firebase_storage: ^14.1.0
  path_provider: ^2.1.5
  google_fonts: ^9.0.0
  just_audio: ^0.10.5
  audio_video_progress_bar: ^2.0.3
  just_audio_background: ^0.0.1-beta.17
  provider: ^6.1.5+1
  url_launcher: ^6.3.2
  archive: ^3.6.1
  syncfusion_flutter_pdf: ^33.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so the app looks right with no internet. Both are under the
  # SIL Open Font License; the licence texts sit beside the files.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
